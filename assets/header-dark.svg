<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gregory Matsnev, AI Engineer</title>
  <desc id="desc">LLM agents, multi-agent systems and RAG in production: 5+ years, thousands of users, terabytes of data, eval-gated releases. The animation shows requests from many users going through a multi-agent system with tools and RAG, then through an eval gate into production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#18143a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#6e7681" fill-opacity="0.32"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="right"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif; }
    .name { font-size: 54px; font-weight: 700; fill: #f0f6fc; letter-spacing: -0.5px; }
    .role { font-size: 32px; font-weight: 700; fill: url(#accent); }
    .line { font-size: 19px; fill: #9198a1; }
    .chip { font-size: 14.5px; font-weight: 600; fill: #e6edf3; }
    .label { font-size: 14px; font-weight: 600; fill: #9198a1; letter-spacing: 0.3px; }
    .edge { stroke: #30364a; stroke-width: 2; fill: none; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#right)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="#30363d"/>

