<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Gregory Matsnev, AI Engineer</title>
  <desc id="desc">LLM agents, multi-agent systems and RAG at scale: 5+ years, thousands of users, terabytes of data, eval-gated releases. The animation shows requests from many users going through a multi-agent system with tools and RAG, then through an eval gate into production.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#8c959f" fill-opacity="0.32"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="right"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect width="1200" height="320" rx="17"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif; }
    .name { font-size: 54px; font-weight: 700; fill: #1f2328; letter-spacing: -0.5px; }
    .role { font-size: 32px; font-weight: 700; fill: url(#accent); }
    .line { font-size: 19px; fill: #59636e; }
    .chip { font-size: 14.5px; font-weight: 600; fill: #1f2328; }
    .label { font-size: 14px; font-weight: 600; fill: #57606a; letter-spacing: 0.3px; }
    .edge { stroke: #c7cbe0; stroke-width: 2; fill: none; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#right)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="17" fill="none" stroke="#d0d7de"/>

